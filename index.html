<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日监控看板 · 中和净值</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f6f8; color: #1a1d24;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .subtle { color: #6b7280; font-size: 13px; }
  .card { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .card h2 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card .meta { color: #6b7280; font-size: 12px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: #6b7280; font-weight: 600; font-size: 12px; background: #fafbfc; position: sticky; top: 0; }
  tbody tr:hover { background: #fafbfc; }
  .pos { color: #c0392b; } .neg { color: #12855a; }
  .mono { font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
  .badge.ok { background: #e7f6ee; color: #12855a; }
  .badge.warn { background: #fdeceb; color: #c0392b; }
  .badge.info { background: #eef1f6; color: #4b5563; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { border: 1px solid #e6e8ec; background: #fff; color: #4b5563; padding: 5px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .tab.active { background: #1a1d24; color: #fff; border-color: #1a1d24; }
  .hidden { display: none; }
  .empty { color: #9aa1ab; font-size: 13px; padding: 12px 0; }
  .chart-box { position: relative; height: 320px; }
  .note { color: #9aa1ab; font-size: 12px; margin-top: 10px; }
  footer { margin-top: 28px; color: #9aa1ab; font-size: 12px; text-align: center; }
  .tbl-scroll { overflow-x: auto; }
  /* KPI band */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; padding: 15px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .kpi.accent { border-left: 4px solid #7c3aed; }
  .kpi .k-label { font-size: 12.5px; color: #6b7280; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .kpi .k-val { font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .kpi .k-sub { font-size: 11.5px; color: #9aa1ab; margin-top: 5px; }
  /* strategy row highlight */
  .strat-row { background: #f5f3ff !important; }
  .strat-row td:first-child { color: #6d28d9; font-weight: 700; }
  .mini { font-size: 11px; color: #9aa1ab; font-weight: 400; }
  .legend-chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:#4b5563; }
  .lc-line { width:16px; height:0; border-top: 2px dashed #7c3aed; }
  /* alerts */
  .alerts { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .alert-box { border-radius: 8px; padding: 9px 12px; font-size: 13px; line-height: 1.55; border-left: 3px solid; }
  .alert-box.up { background: #fdeceb; border-color: #c0392b; color: #7a271a; }
  .alert-box.down { background: #eef8f2; border-color: #12855a; color: #14532d; }
  .alert-box .a-acct { font-weight: 700; }
  .alerts-hd { font-size: 12px; color: #6b7280; margin-top: 16px; font-weight: 600; }
  /* holdings */
  .hold-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #4b5563; margin-bottom: 10px; align-items: center; }
  .lg-item { display: flex; align-items: center; gap: 6px; }
  .lg-swatch { width: 16px; height: 12px; border-radius: 2px; display: inline-block; }
  .lg-long { background: #12855a; } .lg-short { background: #c0392b; }
  .lg-dash { width: 16px; height: 12px; border: 1.5px dashed #555; border-radius: 2px; background: transparent; display: inline-block; }
  .hold-wrap { position: relative; }
  .hold-tip { position: absolute; z-index: 30; pointer-events: none; display: none; background: #1a1d24; color: #fff;
    border-radius: 8px; padding: 8px 11px; font-size: 12px; line-height: 1.55; box-shadow: 0 6px 18px rgba(0,0,0,.20); max-width: 250px; }
  .hold-tip .t-name { font-weight: 600; margin-bottom: 2px; }
  .hold-tip .t-sub { color: #aab0ba; font-size: 11px; }
  .hold-tip .t-qtyrow { margin: 5px 0 3px; }
  .hold-tip .t-qty { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hold-tip .t-row { color: #cfd3db; }
  .hold-tip .t-pos { color: #34d399; } .hold-tip .t-neg { color: #f87171; }
  .hold-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .hold-inner { display: flex; align-items: stretch; gap: 4px; min-width: min-content; }
  .hcol { flex: 0 0 auto; width: 52px; display: flex; flex-direction: column; align-items: center; }
  .hbar-area { position: relative; width: 100%; }
  .hbar-base { position: absolute; left: 0; right: 0; border-top: 1px solid #c3c8cf; }
  .hbar-solid { position: absolute; left: 50%; transform: translateX(-50%); width: 30px; border-radius: 2px; }
  .hbar-solid.long { background: #12855a; } .hbar-solid.short { background: #c0392b; }
  .hbar-dash { position: absolute; left: 50%; transform: translateX(-50%); width: 18px; border: 1.5px dashed rgba(20,20,20,.75); border-radius: 2px; background: transparent; z-index: 2; }
  .hlabel { margin-top: 6px; text-align: center; width: 100%; }
  .hlabel .ret { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hlabel .code { font-size: 10px; color: #6b7280; font-variant-numeric: tabular-nums; }
  .hlabel .nm { font-size: 10px; color: #4b5563; writing-mode: vertical-rl; text-orientation: mixed; height: 96px; margin: 3px auto 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .hcol:hover .hbar-solid { filter: brightness(1.12); }
  .vtable td:first-child, .vtable th:first-child { color: #4b5563; font-weight: 600; }
  .strat-col { background: #f5f3ff; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>每日监控看板 <span class="badge info" id="buildTag" style="font-size:11px;vertical-align:middle">build —</span></h1>
    <span class="subtle" id="pageUpdated">加载中…</span>
  </header>
  <p class="subtle">中和账户净值 · 801总策略 · 持仓 · 总报表 · 财经科技热点 — 定时任务每工作日自动更新</p>

  <section class="kpis" id="kpis"></section>

  <section class="card" id="navCard">
    <h2>💹 账户当日净值 · 持仓敞口 <span id="navStatus"></span></h2>
    <div class="meta" id="navMeta">加载中…</div>
    <div id="navBody"></div>
    <div class="note">「801 总策略」列＝ 801 海外腿 ＋ 星汇星河一号 在岸腿两腿合并。801 的「多头市值」已并入在岸腿星汇星河一号资产净值（按中和任务最新逻辑抓取），不再单列；「今日总市值」相应含在岸腿，「前一日总市值」为券商持仓口径（不含在岸腿）。上涨为红、下跌为绿。</div>
    <div id="alertsBox"></div>
  </section>

  <section class="card" id="summaryCard">
    <h2>📋 总报表（自数据起点至今 · 含夏普/卡玛）</h2>
    <div class="meta" id="summaryMeta">加载中…</div>
    <div class="tbl-scroll" id="summaryBody"></div>
  </section>

  <section class="card" id="weekCard">
    <h2>🗓️ 近一月净值明细（含 801 总策略）</h2>
    <div class="meta" id="weekMeta">加载中…</div>
    <div class="tbl-scroll" id="weekBody"></div>
  </section>


  <footer id="footer"></footer>
</div>

<script>
const bust = () => "?t=" + Date.now();
const fmt = (n) => (n === null || n === undefined || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = (n) => (n === null || n === undefined || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtInt = (n) => (n === null || n === undefined || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const signClass = (n) => n > 0 ? "pos" : (n < 0 ? "neg" : "");
const signStr = (n, suffix="") => (n > 0 ? "+" : "") + fmt(n) + suffix;
const signStr0 = (n, suffix="") => (n > 0 ? "+" : "") + fmt0(n) + suffix;
const pctStr = (v) => (v==null||isNaN(v)) ? "—" : ((v>0?"+":"")+Number(v).toFixed(2)+"%");
const money = (n) => (n==null||isNaN(n)) ? "—" : ((n>=0?"+$":"−$")+fmt0(Math.abs(n)));
const STRAT = "801总策略";
const BUILD = "2026-08-07c";  // 合并转置表·红涨绿跌·星汇=中金所多头初始合约价值
async function loadJSON(path) { const r = await fetch(path + bust(), { cache: "no-store" }); if (!r.ok) throw new Error(path + " " + r.status); return r.json(); }

/* 清理可能残留的 Service Worker / 缓存（旧版本可能注册过，导致页面一直显示旧内容） */
(function cleanupCaches(){
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); } catch(e){}
  try { if (window.caches && caches.keys) caches.keys().then(ks => ks.forEach(k => caches.delete(k))); } catch(e){}
  var bt = document.getElementById("buildTag"); if (bt) bt.textContent = "build " + BUILD;
})();

/* ---------- 投资者 KPI ---------- */
function renderKpis(h) {
  const t = h.totals || {}, sd = (h.strategy801 || {}).daily || {};
  const el = document.getElementById("kpis");
  const card = (label, valHtml, sub, accent) => `<div class="kpi${accent?' accent':''}"><div class="k-label">${label}</div><div class="k-val">${valHtml}</div><div class="k-sub">${sub}</div></div>`;
  const col = (n) => n>0?'pos':(n<0?'neg':'');
  el.innerHTML =
    card("合计在管净值 (AUM)", "$"+fmt0(t.nav), "81099801/02/03/05 当前净值合计", false) +
    card("今日合计盈亏（剔除现金流）", `<span class="${col(t.today)}">${money(t.today)}</span>`, "各账户当日真实盈亏之和", false) +
    card("801 总策略累计", `<span class="${col(sd.cum_pct)}">${pctStr(sd.cum_pct)}</span>`, `今日 ${pctStr(sd.pct)} · 自 2026-06-09 · 两腿合并`, true) +
    card("年初至今合计盈亏", `<span class="${col(t.ytd)}">${money(t.ytd)}</span>`, "剔除出入金 · 含 803 大幅回撤", false);
}

/* ---------- 当日净值 + 持仓敞口 合并·转置表（列：801 / 801总策略 / 802 / 803） ---------- */
function renderNavCombined(nav, h) {
  const statusEl = document.getElementById("navStatus"), metaEl = document.getElementById("navMeta"), body = document.getElementById("navBody");
  metaEl.textContent = "运行日期 " + (nav.run_date || "—") + " · 更新于 " + (nav.updated_at || "—");
  if (nav.status === "no_report") { statusEl.innerHTML = '<span class="badge info">今日无新报告</span>'; body.innerHTML = '<div class="empty">' + esc(nav.message || "当天没有新收到的估值报告。") + '</div>'; return; }
  if (nav.status === "failed") { statusEl.innerHTML = '<span class="badge warn">未获取</span>'; body.innerHTML = '<div class="empty">' + esc(nav.message || "今日未能自动获取报告。") + '</div>'; return; }
  statusEl.innerHTML = '<span class="badge ok">已更新</span>';

  const navBy = {}; (nav.accounts || []).forEach(a => navBy[a.account] = a);
  const E = (h && h.exposure) || {};
  const sd = ((h && h.strategy801) || {}).daily || {};
  const xhMv = ((h && h.strategy801) || {}).xh_mv_cny;
  const ex = k => (E[k] || {}).today || {};
  const exPrev = k => (E[k] || {}).prev || {};
  const long801 = ((ex("81099801").long) || 0) + (xhMv || 0);
  const total801 = long801 + ((ex("81099801").short) || 0);

  const cols = [
    { key: "81099801", strat: false },
    { key: STRAT, strat: true },
    { key: "81099802", strat: false },
    { key: "81099803", strat: false },
  ].filter(c => c.strat ? (sd && sd.curr_nav != null) : navBy[c.key]);

  const dash = '<span class="subtle">—</span>';
  const mv = v => (v == null || isNaN(v) || v === 0) ? dash : fmtInt(Math.round(v));

  const rows = [
    ["当日净值", c => `<span class="mono">${fmt(c.strat ? sd.curr_nav : navBy[c.key].curr_nav)}</span>`],
    ["剔除划转后变化", c => { const v = c.strat ? sd.change : navBy[c.key].change_ex_transfer; return `<span class="mono ${signClass(v)}">${signStr0(v)}</span>`; }],
    ["变化率", c => { const v = c.strat ? sd.pct : navBy[c.key].change_pct; return `<span class="mono ${signClass(v)}">${pctStr(v)}</span>`; }],
    ["今日持仓只数", c => c.strat ? dash : `<span class="mono">${fmtInt(ex(c.key).cnt)}</span>`],
    ["新开仓只数", c => c.strat ? dash : `<span class="mono">${fmtInt(ex(c.key).newcnt)}</span>`],
    ["多头市值 (CNY)", c => { if (c.strat) return dash; const v = c.key === "81099801" ? long801 : ex(c.key).long; return `<span class="mono">${mv(v)}</span>`; }],
    ["空头市值 (CNY)", c => c.strat ? dash : `<span class="mono">${mv(ex(c.key).short)}</span>`],
    ["今日总市值 (CNY)", c => { if (c.strat) return dash; const v = c.key === "81099801" ? total801 : ex(c.key).total; return `<span class="mono">${mv(v)}</span>`; }],
    ["前一日总市值 (CNY)", c => c.strat ? dash : `<span class="mono">${mv(exPrev(c.key).total)}</span>`],
  ];
  const head = "<th>指标</th>" + cols.map(c => `<th${c.strat ? ' style="color:#6d28d9"' : ''}>${c.strat ? '801总策略' : esc(c.key)}</th>`).join("");
  const tb = rows.map(([label, f]) => `<tr><td>${label}</td>${cols.map(c => `<td${c.strat ? ' class="strat-col"' : ''}>${f(c)}</td>`).join("")}</tr>`).join("");
  body.innerHTML = `<div class="tbl-scroll"><table class="vtable"><thead><tr>${head}</tr></thead><tbody>${tb}</tbody></table></div>`;
  if (nav.message) body.innerHTML += '<div class="note">' + esc(nav.message) + '</div>';
}

/* ---------- 总报表 + 异动解释 ---------- */
function renderSummary(h) {
  const S = h.summary || [], meta = document.getElementById("summaryMeta"), body = document.getElementById("summaryBody");
  if (!S.length) { meta.innerHTML = '<span class="neg">无总报表数据</span>'; }
  else {
    meta.textContent = "口径：剔除资金划转 · rf=0 · 年化收益=(期末/期初)^(252/n)−1 · 夏普=日收益均值/标准差×√252 · 卡玛=年化收益/|最大回撤|";
    const isStrat = r => r.account === STRAT;
    const head = '<th>指标</th>' + S.map(r => `<th${isStrat(r)?' style="color:#6d28d9"':''}>${isStrat(r)?'801总策略':esc(r.account)}</th>`).join("");
    const metrics = [
      ["区间", r => `<span class="subtle">${esc(r.range)}</span>`],
      ["起始净值", r => fmt0(r.start_nav)],
      ["当前净值", r => fmt0(r.cur_nav)],
      ["累计收益率", r => `<span class="${signClass(r.cum_ret)}">${signStr(r.cum_ret,"%")}</span>`],
      ["累计收益额", r => `<span class="${signClass(r.cum_amt)}">${signStr0(r.cum_amt)}</span>`],
      ["年化收益", r => `<span class="${signClass(r.ann_ret)}">${signStr(r.ann_ret,"%")}</span>`],
      ["年化波动", r => `${fmt(r.vol)}%`],
      ["最大回撤", r => `<span class="neg">${fmt(r.mdd)}%</span>`],
      ["夏普", r => `<span class="${signClass(r.sharpe)}">${r.sharpe==null?"—":(r.sharpe>0?"+":"")+r.sharpe.toFixed(2)}</span>`],
      ["卡玛", r => `<span class="${signClass(r.calmar)}">${r.calmar==null?"—":(r.calmar>0?"+":"")+r.calmar.toFixed(2)}</span>`],
    ];
    const rows = metrics.map(([label, f]) => `<tr><td>${label}</td>${S.map(r => `<td class="mono${isStrat(r)?' strat-col':''}">${f(r)}</td>`).join("")}</tr>`).join("");
    body.innerHTML = `<table class="vtable"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  const A = h.alerts || {}, box = document.getElementById("alertsBox");
  if (A.items && A.items.length) {
    const items = A.items.map(it => `<div class="alert-box ${it.gain?'up':'down'}"><span class="a-acct">${it.gain?'▲':'▼'} ${esc(it.account)}</span> ${esc(it.text)}</div>`).join("");
    box.innerHTML = `<div class="alerts-hd">⚠️ 当日单账户净值变动超过 ±$${fmtInt(A.threshold||10000)} 的说明（运行日 ${esc(A.date||"—")}）</div><div class="alerts">${items}</div>`;
  } else { box.innerHTML = `<div class="alerts-hd">当日没有单账户净值变动超过 ±$${fmtInt((A.threshold)||10000)} 的情况。</div>`; }
}

/* ---------- 净值曲线（含 801总策略 虚线）+ 上周表 ---------- */
const COLORS = { "81099801":"#2563eb", "801总策略":"#7c3aed", "81099802":"#12855a", "81099803":"#c0392b", "81099805":"#b8860b" };
function renderChart(h) {
  const series = h.series || [], cols = h.cols || h.accounts || [];
  document.getElementById("chartMeta").textContent = "最近约一个月 · 单位 USD · 紫色虚线为 801 总策略（两腿合并）· 更新于 " + (h.updated_at || "—");
  if (!series.length) { document.getElementById("chartMeta").innerHTML = '<span class="neg">无历史数据</span>'; return; }
  const lastDate = new Date(series[series.length - 1].date); const cutoff = new Date(lastDate); cutoff.setDate(cutoff.getDate() - 31);
  const win = series.filter(s => new Date(s.date) >= cutoff); const labels = win.map(s => s.date.slice(5));
  const use = cols.filter(a => win.some(s => s[a] != null));
  const datasets = use.map(a => { const strat = a === STRAT;
    return { label: a, data: win.map(s => s[a]), borderColor: COLORS[a] || "#666", backgroundColor: COLORS[a] || "#666",
      borderWidth: strat ? 2.6 : 2, pointRadius: strat ? 0 : 2, borderDash: strat ? [7,4] : [], tension: 0.25, spanGaps: true }; });
  new Chart(document.getElementById("navChart"), { type: "line", data: { labels, datasets },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "top", labels: { boxWidth: 14, font: { size: 12 } } }, tooltip: { callbacks: { label: c => c.dataset.label + ": " + fmt(c.parsed.y) } } },
      scales: { y: { ticks: { callback: v => (v/1000).toFixed(0) + "k", font: { size: 11 } }, grid: { color: "#eef0f3" } }, x: { ticks: { font: { size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { display: false } } } } });
  document.getElementById("chartNote").textContent = "801 总策略（紫色虚线）= 81099801 海外腿 ＋ 星汇星河一号 在岸腿的合并净值：当 801 空头承压时，在岸多头腿通常反向对冲，故合并曲线更平稳。";
}
function renderWeek(h) {
  const weekly = h.monthly || {}; const order = h.cols || h.accounts || [];
  const accts = order.filter(a => (weekly[a] || []).length);
  const meta = document.getElementById("weekMeta"), body = document.getElementById("weekBody");
  if (!accts.length) { meta.innerHTML = '<span class="neg">无近一月数据</span>'; return; }
  const dates = [...new Set(accts.flatMap(a => weekly[a].map(r => r.date)))].sort();
  const idx = {}; accts.forEach(a => { idx[a] = {}; weekly[a].forEach(r => idx[a][r.date] = r); });
  meta.textContent = "各账户近一月每日净值与剔除划转后变化率；801总策略列为两腿合并净值与合并变化率";
  const head = "<th>日期</th>" + accts.map(a => `<th${a===STRAT?' style="color:#6d28d9"':''}>${a} 净值</th><th${a===STRAT?' style="color:#6d28d9"':''}>${a} 变化率</th>`).join("");
  const rows = dates.map(dt => { const cells = accts.map(a => { const r = idx[a][dt];
      if (!r) return '<td class="mono subtle">—</td><td class="mono subtle">—</td>';
      const pct = r.pct; return `<td class="mono">${fmt(r.nav)}</td><td class="mono ${signClass(pct)}">${pct==null?"—":signStr(pct,"%")}</td>`; }).join("");
    return `<tr><td>${dt}</td>${cells}</tr>`; }).join("");
  body.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

(async function () {
  let latest = "";
  let nav = null, h = null;
  try { nav = await loadJSON("nav.json"); latest = nav.updated_at || latest; }
  catch (e) { document.getElementById("navMeta").innerHTML = '<span class="neg">净值数据未找到（nav.json）</span>'; }
  try { h = await loadJSON("history.json"); }
  catch (e) { ["summaryMeta","weekMeta"].forEach(id => { const el=document.getElementById(id); if(el) el.innerHTML = '<span class="neg">历史数据未找到（history.json）</span>'; }); }
  if (nav) renderNavCombined(nav, h || {});
  if (h) { renderKpis(h); renderSummary(h); renderWeek(h); }
  document.getElementById("pageUpdated").textContent = latest ? ("最近更新 " + latest) : "";
  document.getElementById("footer").textContent = "本页每次打开自动读取最新数据 · " + new Date().toLocaleString("zh-CN");
})();
</script>
</body>
</html>
